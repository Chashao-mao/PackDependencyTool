[package]
name = "axolotl-desktop"
version = "0.1.0"
edition = "2021"
description = "Axolotl Companion: dependency, conflict and log analysis"
license = "MIT"

[lib]
name = "axolotl_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rmcp = { version = "3.12", features = ["client", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", features = ["sync", "time"] }
regex = "1"
zip = "2"
