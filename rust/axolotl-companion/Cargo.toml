[package]
name = "axolotl-companion"
version = "0.1.0"
edition = "2021"
description = "Lightweight Rust companion that talks to Axolotl Launcher over MCP"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "3.12", features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "axolotl-companion"
path = "src/main.rs"
