name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore src/PackDepTool.App/PackDepTool.App.csproj
      - run: dotnet build src/PackDepTool.App/PackDepTool.App.csproj -c Release --no-restore
      - run: dotnet test tests/PackDepTool.Core.Tests/PackDepTool.Core.Tests.csproj -c Release --no-restore
